{% extends "layout.html" %}

{% block title %}Satın Alma Talebi Oluştur | Dernek Dijital{% endblock %}

{% block content %}
<section class="section">
  <div class="container form-card">
    <h1>Satın Alma Talebinizi Oluşturun</h1>
    <p class="section-intro">Tercih ettiğiniz ürün için bilgilerinizi bırakın, en kısa sürede sizinle iletişime geçelim.</p>
    <form method="post" class="form-grid">
      <div class="form-group">
        <label for="product_id">Ürün Seçin</label>
        <select id="product_id" name="product_id" required>
          {% for product in products %}
            <option value="{{ product.id }}" {% if request.args.get('product_id', type=int) == product.id %}selected{% endif %}>
              {{ product.name }} - {{ "%.2f" | format(product.price) }} ₺
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="full_name">Ad Soyad</label>
        <input type="text" id="full_name" name="full_name" placeholder="Adınızı ve soyadınızı girin" required>
      </div>
      <div class="form-group">
        <label for="email">E-posta</label>
        <input type="email" id="email" name="email" placeholder="ornek@eposta.com" required>
      </div>
      <div class="form-group">
        <label for="phone">Telefon</label>
        <input type="tel" id="phone" name="phone" placeholder="5xx xxx xx xx">
      </div>
      <div class="form-group form-group-full">
        <label for="note">Not</label>
        <textarea id="note" name="note" rows="4" placeholder="Talebinizle ilgili ek bilgi paylaşabilirsiniz."></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="button button-primary">Talep Gönder</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
