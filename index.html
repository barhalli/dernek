<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profesyonel Hesap Makinesi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="calculator" aria-label="Profesyonel Hesap Makinesi">
        <header class="display" aria-live="polite">
          <div class="expression" id="expression">0</div>
          <div class="result" id="result">0</div>
        </header>
        <div class="controls" role="group" aria-label="Hesap makinesi tuşları">
          <button type="button" class="btn function" data-action="clear-all">AC</button>
          <button type="button" class="btn function" data-action="clear-entry">CE</button>
          <button type="button" class="btn function" data-action="toggle-sign">±</button>
          <button type="button" class="btn operator" data-type="operator" data-value="/">÷</button>

          <button type="button" class="btn" data-type="number" data-value="7">7</button>
          <button type="button" class="btn" data-type="number" data-value="8">8</button>
          <button type="button" class="btn" data-type="number" data-value="9">9</button>
          <button type="button" class="btn operator" data-type="operator" data-value="*">×</button>

          <button type="button" class="btn" data-type="number" data-value="4">4</button>
          <button type="button" class="btn" data-type="number" data-value="5">5</button>
          <button type="button" class="btn" data-type="number" data-value="6">6</button>
          <button type="button" class="btn operator" data-type="operator" data-value="-">−</button>

          <button type="button" class="btn" data-type="number" data-value="1">1</button>
          <button type="button" class="btn" data-type="number" data-value="2">2</button>
          <button type="button" class="btn" data-type="number" data-value="3">3</button>
          <button type="button" class="btn operator" data-type="operator" data-value="+">+</button>

          <button type="button" class="btn function" data-action="percentage">%</button>
          <button type="button" class="btn" data-type="number" data-value="0">0</button>
          <button type="button" class="btn" data-type="number" data-value=".">,</button>
          <button type="button" class="btn equals" data-action="calculate">=</button>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
